# Cowork Queue — variante pour un Traefik déjà en place (réseau externe, certresolver).
# Utilisation depuis la racine du projet (install.sh écrit COMPOSE_FILE dans .env) :
#   docker compose -f deploy/docker-compose.traefik.yml up -d
# Les chemins sont relatifs à deploy/ ; le fichier .env reste celui de la racine.
name: ${COMPOSE_PROJECT_NAME:-cowork-queue}

services:
  app:
    image: ghcr.io/klevisgolemi/cowork-queue:${VERSION:-latest}
    build: ..
    restart: unless-stopped
    env_file: ../.env
    volumes:
      - queue_data:/data
    networks:
      - default
      - traefik
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik_proxy}"
      - "traefik.http.routers.cowork-queue.rule=${TRAEFIK_RULE:?TRAEFIK_RULE est obligatoire (voir .env.example)}"
      - "traefik.http.routers.cowork-queue.entrypoints=websecure"
      - "traefik.http.routers.cowork-queue.tls=true"
      - "traefik.http.routers.cowork-queue.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.services.cowork-queue.loadbalancer.server.port=3000"

  # Mise à jour en un clic depuis l'interface (optionnelle) : COMPOSE_PROFILES=updater dans .env.
  updater:
    profiles: ["updater"]
    build: ./updater
    restart: unless-stopped
    environment:
      UPDATER_SECRET: ${UPDATER_SECRET:-}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-cowork-queue}
      COMPOSE_FILE: ${COMPOSE_FILE:-deploy/docker-compose.traefik.yml}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ..:/project:ro

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik_proxy}

volumes:
  queue_data:
    name: ${QUEUE_VOLUME_NAME:-cowork-queue-data}
