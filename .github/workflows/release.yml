name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/klevisgolemi/agent-inbox

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Vérifier que le tag correspond à package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          pkg="$(node -p "require('./package.json').version")"
          if [ "${TAG#v}" != "$pkg" ]; then
            echo "::error::Tag ${TAG} différent de la version de package.json (${pkg})"
            exit 1
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:css
      - run: npm run check

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Extraire les notes de version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          notes=""
          if [ -f CHANGELOG.md ]; then
            # Section « ## [x.y.z] » jusqu'à la suivante.
            notes="$(awk -v v="$version" '
              /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
              found { print }
            ' CHANGELOG.md)"
          fi
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            notes="Version ${version}. Image : \`${IMAGE}:${version}\`."
          fi
          printf '%s\n' "$notes" > release-notes.md
      - name: Empaqueter le skill Agent Inbox
        run: cd skills && zip -r ../agent-inbox-skill.zip agent-inbox
      - name: Publier la release GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md $prerelease agent-inbox-skill.zip
