# Agent Inbox — déploiement par défaut : application + Caddy (HTTPS automatique).
# Seul Caddy publie des ports : l'application n'est jamais exposée directement
# (le limiteur de débit ne fait confiance qu'à un seul proxy).
name: ${COMPOSE_PROJECT_NAME:-agent-inbox}

services:
  app:
    image: ghcr.io/klevisgolemi/agent-inbox:${VERSION:-latest}
    build: .
    restart: unless-stopped
    # Arrêt propre : l'application coupe ses attentes longues et sort en moins de 15 s.
    stop_grace_period: 20s
    env_file: .env
    volumes:
      - queue_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_HOST: ${SITE_HOST:?SITE_HOST est obligatoire (voir .env.example)}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Mise à jour en un clic depuis l'interface (optionnelle) : COMPOSE_PROFILES=updater dans .env.
  updater:
    profiles: ["updater"]
    build: ./deploy/updater
    restart: unless-stopped
    environment:
      UPDATER_SECRET: ${UPDATER_SECRET:-}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-agent-inbox}
      COMPOSE_FILE: ${COMPOSE_FILE:-docker-compose.yml}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/project:ro

volumes:
  queue_data:
    # Nom fixe : une installation v1 peut réutiliser son volume existant
    # (QUEUE_VOLUME_NAME dans .env, voir .env.example).
    name: ${QUEUE_VOLUME_NAME:-agent-inbox-data}
  caddy_data:
  caddy_config:
